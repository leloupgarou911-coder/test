<!DOCTYPE html>
<html lang="fr" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NameForge — 234+ Générateurs de Noms Gratuits & Professionnels</title>
    <meta
      name="description"
      content="NameForge est une plateforme professionnelle gratuite de 234+ générateurs de noms pour marques, commerces, personnages, RPG, fantasy, univers animés, sciences et technologies."
    />
    <meta
      name="keywords"
      content="générateur de noms, name generator, générateur de marques, fantasy name generator, RPG names, générateur entreprise, startup name generator"
    />
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#060611" />

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="./images/nameforge-logo.png" />
    <link rel="apple-touch-icon" href="./images/nameforge-logo.png" />
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%230f172a'/><path d='M7 21h18v3H7z' fill='%2306b6d4'/><path d='M5 13h18a3 3 0 0 1 3 3v2H5z' fill='%238b5cf6'/><path d='M17 5l-6 9h5l-1 7 7-10h-5l2-6z' fill='%2338bdf8'/></svg>"
    />

    <!-- Prevent Theme Flash -->
    <script>
      (function() {
        try {
          var raw = localStorage.getItem('nameforge_settings');
          if (raw) {
            var s = JSON.parse(raw);
            var isDark = true;
            if (s.theme === 'light') isDark = false;
            else if (s.theme === 'system') {
              isDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
            }
            if (isDark) {
              document.documentElement.classList.add('dark');
              document.documentElement.classList.remove('light');
            } else {
              document.documentElement.classList.add('light');
              document.documentElement.classList.remove('dark');
            }
            if (['ar', 'he', 'fa', 'ur', 'ps'].indexOf(s.language) !== -1) {
              document.documentElement.dir = 'rtl';
            }
            if (s.textSize) {
              document.documentElement.classList.add('text-size-' + s.textSize);
            }
          }
        } catch(e) {}
      })();
    </script>

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="NameForge — 234+ Générateurs de Noms Professionnels" />
    <meta
      property="og:description"
      content="Forgez des noms uniques et mémorables pour vos entreprises, marques, personnages, récits RPG et projets créatifs."
    />
    <meta property="og:site_name" content="NameForge" />

    <!-- Structured Data -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "NameForge",
        "applicationCategory": "UtilitiesApplication",
        "operatingSystem": "Web Browser",
        "isAccessibleForFree": true,
        "offers": {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "EUR"
        }
      }
    </script>
  </head>
  <body class="bg-[#060611] text-white antialiased transition-colors duration-200">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
